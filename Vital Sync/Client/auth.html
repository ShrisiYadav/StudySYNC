<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - VitalSync</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            padding: 90px 20px 40px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
        }

        .auth-toggle {
            display: flex;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 24px;
            gap: 16px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 4px 12px;
            position: relative;
            transition: var(--transition-smooth);
        }

        .toggle-btn.active {
            color: var(--text-primary);
        }

        .toggle-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer-text span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .gender-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 4px;
        }

        .gender-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px;
            text-align: center;
            transition: var(--transition-smooth);
        }

        .gender-btn.active {
            background: var(--primary-glow);
            border-color: var(--primary);
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span>Vital</span>Sync
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="auth.html" class="active">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <main class="auth-container">
        <div class="glass-card auth-card">
            <!-- Tabs Toggle Header -->
            <div class="auth-toggle">
                <button class="toggle-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
                <button class="toggle-btn" id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form Block -->
            <div class="form-section active" id="login-section">
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="input-field" placeholder="Enter your email" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="input-field" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Log In</button>
                </form>
                <p class="auth-footer-text">New to VitalSync? <span onclick="switchTab('register')">Register here</span></p>
            </div>

            <!-- Register Form Block -->
            <div class="form-section" id="register-section">
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="input-field" placeholder="Rahul Sharma" required autocomplete="name">
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="input-field" placeholder="rahul@email.com" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="input-field" placeholder="Min. 8 characters" required autocomplete="new-password">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="input-group">
                            <label for="reg-age">Age</label>
                            <input type="number" id="reg-age" class="input-field" placeholder="20" required min="1">
                        </div>
                        <div class="input-group">
                            <label>Gender</label>
                            <div class="gender-options">
                                <button type="button" class="gender-btn" id="gender-male" onclick="selectGender('male')">Male</button>
                                <button type="button" class="gender-btn" id="gender-female" onclick="selectGender('female')">Female</button>
                                <button type="button" class="gender-btn" id="gender-other" onclick="selectGender('other')">Other</button>
                            </div>
                            <input type="hidden" id="reg-gender" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
                </form>
                <p class="auth-footer-text">Already registered? <span onclick="switchTab('login')">Sign in instead</span></p>
            </div>
        </div>
    </main>

    <!-- JS Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
